# ---------------- #
#   Main Configs   #
# ---------------- #
baseurl:
url: https://wrlog.github.io/Wr.github.io/
date_format: "ordinal"
title: Wen Rui Tan
subtitle: "PhD Candidate | Clinical Pharmacologist | Pharmacometrician"
description: "Personal website and portfolio of Wen Rui Tan - PhD candidate, clinical pharmacologist, and pharmacometrician. Explore my research, publications, blog posts, and professional journey in pharmacokinetics and pharmacodynamics."
keywords: Wen Rui Tan, PhD, Clinical Pharmacologist, Pharmacometrician, PK/PD, Pharmacokinetics, Pharmacodynamics, Research, NONMEM
timezone: America/New_York
encoding: "utf-8"
side_bar_repo_limit: 0

# ---------------- #
#      Author      #
# ---------------- #
author: Wen Rui Tan
organization: 
organization_url: 
github_username: Wrlog
location: United States
email: Wen.Tan@cchmc.org
linkedin: wenrui97
twitter: 
website: https://wrlog.github.io/Wr.github.io/

# ---------------- #
#    Navigation    #
# ---------------- #

navs:
  -
    href: /
    label: Home

  -
    href: /about/
    label: About

  -
    href: /portfolio/
    label: Portfolio

  -
    href: /categories/
    label: Blog

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
paginate: 10
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
    - jekyll-github-metadata
    - rouge
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jemoji
collections:
    wiki:
        output: true
        permalink: /wiki/:path/

exclude:
    - template.md
        
repository: Wrlog/Wr.github.io

# ---------------- #
#      Comments    #
# ---------------- #
# Supported providers: disqus, gitment, gitalk, utterances, beaudar.
# No provider is configured, so comments are disabled site-wide.
# Do not commit OAuth client secrets here: this repository is public, and
# anything placed in this file is served as part of the site.
comments_provider:

disqus:
    username:

lazy_load_disqus: false

# ---------------- #
#      Search      #
# ---------------- #
simple_jekyll_search:
    # Whether to index full post bodies as well as titles
    fulltext: false
    # Maximum number of search results to show
    limit: 10

# ---------------- #
#      Google      #
# ---------------- #
google:
    analytics_id: G-7WJEV91PM7

