# ---------------- #
#    Navigation    #
# ---------------- #

navs:
  -
    href: /
    label: Home

  -
    href: /about/
    label: About

  -
    href: /portfolio/
    label: Portfolio

  -
    href: /notes/
    label: Notes

# ---------------- #
#       RSS        #
# ---------------- #
subscribe_rss: /feed.xml

# ---------------- #
#      Jekyll      #
# ---------------- #
markdown: kramdown
kramdown:
    input: GFM
highlighter: rouge
paginate: 10
lsi: false
quiet: false
excerpt_separator: "\n\n"
permalink: /:year/:month/:day/:title/
plugins:
    - jekyll-github-metadata
    - rouge
    - jekyll-paginate
    - jekyll-sitemap
    - jekyll-feed
    - jemoji
# Repository files that should not be published as pages on the live site.
exclude:
    - README.md
    - vendor/
    - .bundle/
    - Gemfile
    - Gemfile.lock
    - docs/

repository: Wrlog/Wrlog.github.io

# ---------------- #
#      Comments    #
# ---------------- #
# Supported providers: disqus, gitment, gitalk, utterances, beaudar.
# No provider is configured, so comments are disabled site-wide.
# Do not commit OAuth client secrets here: this repository is public, and
# anything placed in this file is served as part of the site.
comments_provider:

disqus:
    username:

lazy_load_disqus: false

# ---------------- #
#      Search      #
# ---------------- #
simple_jekyll_search:
    # Whether to index full post bodies as well as titles
    fulltext: false
    # Maximum number of search results to show
    limit: 10

# ---------------- #
#      Google      #
# ---------------- #
google:
    analytics_id: G-7WJEV91PM7

